<!doctype html>
<html lang="ru-RU" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#0f0a1a">
<link rel="canonical" href="{{CANON}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="ASTRUM">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:image" content="{{OGIMG}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{OGIMG}}">
<link rel="icon" href="{{UP}}favicon.ico" sizes="48x48">
<link rel="icon" href="{{UP}}assets/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="{{UP}}assets/apple-touch-icon.png">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Onest:wght@400;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Onest:wght@400;600&display=swap"></noscript>
<script>
(function(){var s=null;try{s=localStorage.getItem('astrum-sky')}catch(e){}
if(!s){s='night'}
document.documentElement.dataset.sky=s})();
</script>
<style>
:root{--bg:#f5f0ff;--panel:#ebe3fb;--ink:#1a1033;--muted:#6a5d88;--line:#1a103329;--soft:#1a10330a;--glass:#f5f0ff;--coral:#7e22ce;--grad:#7e22ce;--code:#e2d6f7;--shadow:none;--ease:cubic-bezier(.16,1,.3,1)}
html[data-sky=night]{--bg:#0f0a1a;--panel:#1a1230;--ink:#f3eefc;--muted:#a79bc4;--line:#f3eefc26;--soft:#f3eefc0d;--glass:#0f0a1a;--coral:#c084fc;--grad:#9333ea;--code:#261a45}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:clip;scroll-padding-top:100px}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:17px}
h1,h2,h3,h4,.brand{font-family:Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;font-weight:700;letter-spacing:.01em;line-height:1}
a{color:inherit}button{font-family:inherit}
.logo{width:26px;height:26px;display:block}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:22px;height:70px;padding:0 28px;max-width:1500px;margin:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:17px;letter-spacing:.2em;text-decoration:none}
.crumb{color:var(--muted);font-size:14px;font-weight:600;padding-left:18px;border-left:1px solid var(--line)}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:8px 14px;border-radius:4px;font-size:14.5px;font-weight:600;color:var(--muted);text-decoration:none;transition:.2s}
.links a:hover{color:var(--ink);background:var(--soft)}
.ib{width:40px;height:40px;border-radius:4px;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.moon{display:none}html[data-sky=night] .moon{display:block}html[data-sky=night] .sun{display:none}
.menu{display:none}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr) 230px;gap:56px;max-width:1500px;margin:auto;padding:0 28px}
aside.nav{position:sticky;top:70px;align-self:start;height:calc(100vh - 70px);overflow:auto;padding:30px 6px 40px 0}
.search{position:relative;margin-bottom:28px}
.search input{width:100%;height:46px;border-radius:4px;border:1px solid var(--line);background:var(--panel);padding:0 44px 0 42px;font:inherit;font-size:15px;color:var(--ink);outline:0}
.search input:focus{border-color:var(--coral);box-shadow:0 0 0 4px #f28b7826}
.search svg{position:absolute;left:14px;top:13px;width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.search kbd{position:absolute;right:12px;top:11px;font:600 12px Onest,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.results{position:absolute;left:0;right:0;top:54px;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:5}
.results.on{display:block}
.results a{display:block;padding:12px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.results a:last-child{border:0}.results a:hover,.results a.sel{background:var(--soft)}
.results b{display:block;font-size:15px}.results small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results mark{background:#f28b7840;color:inherit;border-radius:4px}
.results .none{padding:16px;color:var(--muted);font-size:14.5px}
.grp{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px 14px}
.grp:first-of-type{margin-top:0}
.item{display:block;padding:10px 14px;border-radius:4px;text-decoration:none;font-size:15.5px;font-weight:600;color:var(--muted);transition:color .2s,background .2s;position:relative}
.item:hover{color:var(--ink);background:var(--soft)}
.item.on{color:var(--ink);background:var(--panel);box-shadow:0 1px 0 var(--line)}
.item.on::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:4px;background:var(--grad)}

main{padding:52px 0 100px;min-width:0}
.cover{border-radius:4px;overflow:hidden;aspect-ratio:21/8;margin-bottom:42px;box-shadow:var(--shadow);background:var(--soft)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
main h1{font-size:clamp(44px,6vw,84px);margin:14px 0 34px;line-height:.95}
.prose{max-width:760px}
.prose>*+*{margin-top:1.1em}
.prose h2{font-size:clamp(30px,3.2vw,42px);font-weight:700;margin-top:2.2em;padding-top:1.2em;border-top:1px solid var(--line)}
.prose h2:first-child{margin-top:0;border:0;padding:0}
.prose h3{font-size:21px;font-weight:700;margin-top:1.8em}
.prose h4{font-size:17px;font-weight:700;margin-top:1.6em}
.prose h2+*,.prose h3+*{margin-top:.8em}
.prose :is(h2,h3):hover .anc{opacity:1}
.anc{opacity:0;margin-left:10px;color:var(--coral);text-decoration:none;font-weight:400;transition:opacity .2s}
.prose p,.prose li{color:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.prose ul,.prose ol{padding-left:1.3em}.prose li{padding-left:.3em}.prose li+li{margin-top:.5em}
.prose li::marker{color:var(--coral)}
.prose strong{color:var(--ink);font-weight:600}
.prose a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--coral)}.prose a:hover{color:var(--coral)}
.prose code{font:600 .88em ui-monospace,Consolas,monospace;background:var(--code);padding:.18em .5em;border-radius:4px;white-space:nowrap}
.prose img{max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;display:block;margin-top:1.4em;background:var(--soft)}
.prose img+img{margin-top:.8em}
.prose blockquote{border-radius:4px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--coral);padding:18px 22px}
.prose blockquote p{margin:0}
.prose .tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.prose table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
.prose th{text-align:left;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.prose td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:top}
.prose tr:last-child td{border:0}.prose td:first-child{font-weight:600;color:var(--ink)}
.prose .btn{display:inline-flex;align-items:center;height:50px;padding:0 26px;border-radius:4px;border:0;background:var(--grad);color:#fff;font-weight:600;font-size:15.5px;margin:6px 10px 0 0;box-shadow:none}
.prose .btn:hover{color:#fff;background:var(--ink)}
.prose .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.prose .btn.ghost:hover{background:var(--ink);color:var(--bg)}

.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:70px;max-width:760px}
.pn a{padding:22px 26px;border-radius:4px;border:1px solid var(--line);background:var(--panel);text-decoration:none;transition:border-color .3s,transform .3s var(--ease)}
.pn a:hover{transform:translateY(-3px);border-color:var(--coral)}
.pn small{display:block;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.pn b{font-family:Oswald,sans-serif;font-size:22px;display:block;margin-top:8px;text-transform:uppercase}
.pn .nx{text-align:right;grid-column:2}

aside.toc{position:sticky;top:70px;align-self:start;padding:52px 0 40px;max-height:calc(100vh - 70px);overflow:auto}
.toc h2{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-family:Onest,sans-serif;line-height:1.2}
.toc a{display:block;padding:6px 0 6px 16px;border-left:1px solid var(--line);font-size:14px;color:var(--muted);text-decoration:none;line-height:1.4}
.toc a.l3{padding-left:30px;font-size:13.5px}
.toc a:hover{color:var(--ink)}.toc a.on{color:var(--ink);border-left-color:var(--coral);font-weight:600}

.lb{position:fixed;inset:0;z-index:100;background:rgba(15,10,20,.92);display:none;place-items:center;padding:30px;cursor:zoom-out}
.lb.on{display:grid}.lb img{max-width:100%;max-height:90vh;border-radius:4px}

@media(max-width:1180px){.shell{grid-template-columns:260px minmax(0,1fr);gap:40px}aside.toc{display:none}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;padding:0 20px}
  .menu{display:grid}.links{display:none}.ib.menu{margin-left:auto}
  aside.nav{position:fixed;inset:70px 0 0 0;z-index:35;background:var(--bg);height:auto;padding:24px 20px;transform:translateX(-100%);transition:transform .35s var(--ease);visibility:hidden}
  .open aside.nav{transform:none;visibility:visible}
  .crumb{display:none}main{padding-top:28px}.cover{aspect-ratio:16/8;border-radius:4px}.pn{grid-template-columns:1fr}.pn .nx{grid-column:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="{{UP}}" class="brand" aria-label="ASTRUM — главная"><img class="logo" src="{{UP}}assets/logo.webp" width="26" height="26" alt="">ASTRUM</a>
  <span class="crumb">Вики</span>
  <nav class="links" aria-label="Сайт">
    <a href="{{UP}}">Главная</a>
    <a href="{{UP}}map/">Карта</a>
    <a href="https://shop.astrums.pro">Магазин</a>
    <a href="https://discord.gg/7jnWGDB2fP" rel="noopener">Discord</a>
  </nav>
  <button class="ib" id="sw" aria-label="День / ночь" title="День / ночь">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
  </button>
  <button class="ib menu" id="menu" aria-label="Разделы"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div></header>

<div class="shell">
  <aside class="nav" id="nav" aria-label="Разделы вики">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск по вики" autocomplete="off" aria-label="Поиск по вики"><kbd>/</kbd>
      <div class="results" id="res"></div>
    </div>
    {{MENU}}
  </aside>

  <main>
    <article>
      {{COVER}}
      <span class="eyebrow">{{GROUP}}</span>
      <h1>{{H1}}</h1>
      <div class="prose">{{BODY}}</div>
    </article>
    <nav class="pn" aria-label="Другие статьи">{{PN}}</nav>
  </main>

  <aside class="toc" id="toc" aria-label="Содержание">{{TOC}}</aside>
</div>

<div class="lb" id="lb"><img alt=""></div>
<script>
const W='{{W}}',$=s=>document.querySelector(s),root=document.documentElement;
/* день / ночь, меню, просмотр картинок */
$('#sw').onclick=()=>{const s=root.dataset.sky==='night'?'day':'night';root.dataset.sky=s;try{localStorage.setItem('astrum-sky',s)}catch(e){}};
$('#menu').onclick=()=>document.body.classList.toggle('open');
document.querySelectorAll('.prose img').forEach(i=>i.onclick=()=>{$('#lb img').src=i.src;$('#lb').classList.add('on')});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
/* подсветка текущего раздела в оглавлении */
const hs=[...document.querySelectorAll('.prose h2,.prose h3')],tl=[...document.querySelectorAll('#toc a')];
if(tl.length)addEventListener('scroll',()=>{let c=null;hs.forEach(h=>{if(h.getBoundingClientRect().top<140)c=h.id});tl.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+c))},{passive:true});
/* поиск: индекс подгружается при первом фокусе */
let IDX=null,P=null,sel=-1;const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=s=>s==='info'?(W||'./'):W+s+'/';
const q=$('#q'),box=$('#res');
const load=()=>P||(P=fetch(W+'search.json').then(r=>r.json()).then(j=>IDX=j).catch(()=>IDX=[]));
q.addEventListener('focus',load);
q.addEventListener('input',async()=>{
  const v=q.value.trim().toLowerCase();if(!v){box.classList.remove('on');return}
  await load();
  const out=[];IDX.forEach(p=>{const ti=p.t.toLowerCase().includes(v),i=p.x.toLowerCase().indexOf(v);if(ti||i>-1)out.push({p,snip:i>-1?p.x.slice(Math.max(0,i-30),i+80):'',rank:ti?0:1})});
  out.sort((a,b)=>a.rank-b.rank);sel=-1;
  const re=new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),hl=s=>esc(s).replace(re,m=>`<mark>${m}</mark>`);
  box.innerHTML=out.length?out.slice(0,7).map(o=>`<a href="${url(o.p.s)}"><b>${hl(o.p.t)}</b><small>${hl(o.snip)}</small></a>`).join(''):'<div class="none">Ничего не найдено</div>';
  box.classList.add('on');
});
q.addEventListener('keydown',e=>{const a=[...box.querySelectorAll('a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+a.length)%a.length;a.forEach((x,i)=>x.classList.toggle('sel',i===sel))}
  if(e.key==='Enter'&&a.length)(a[sel]||a[0]).click();
  if(e.key==='Escape'){box.classList.remove('on');q.blur()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))box.classList.remove('on')});
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();q.focus()}if(e.key==='Escape')$('#lb').classList.remove('on')});
</script>
</body>
</html>
