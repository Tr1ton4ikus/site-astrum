# Публикует сайт на GitHub Pages при каждом изменении (в том числе когда статью сохраняют в редакторе вики).
# Перед публикацией собирает вики в HTML-страницы, sitemap.xml и robots.txt.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node wiki/build.mjs --stamp
      - run: rm -rf node_modules wiki/_template.html wiki/build.mjs wiki/dev.mjs wiki/README.md package.json package-lock.json site.json wiki/admin/oauth-worker.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
