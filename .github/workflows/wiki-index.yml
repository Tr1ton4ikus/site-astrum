# После каждого сохранения статьи в редакторе пересобирает список статей вики (wiki/content/index.json)
name: wiki-index
on:
  push:
    branches: [main]
    paths: ['wiki/content/*.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node wiki/build.mjs
      - name: Сохранить index.json
        run: |
          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"
          git add wiki/content/index.json
          git diff --cached --quiet || git commit -m "wiki: обновлён список статей" && git push
